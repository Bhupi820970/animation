name: Auto Paper Cutout Video Factory

on:
  schedule:
    - cron: '30 4 * * *'   # Daily 10:00 AM IST
    - cron: '30 13 * * *'  # Daily 7:00 PM IST
  workflow_dispatch:       # Phone se manual test karne ke liye

permissions:
  contents: write

jobs:
  build_video:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Python & Edge-TTS
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg python3-pip
          pip install edge-tts

      - name: Install Node Packages
        run: npm install

      - name: Generate Voice & Story Visuals
        run: npm run prepare

      - name: Render Full HD Video (Remotion)
        run: npm run render

      - name: Save Finished MP4 Video
        uses: actions/upload-artifact@v4
        with:
          name: youtube-ready-video
          path: out/final_video.mp4

      - name: Mark Story as Done in GitHub
        run: |
          git config user.name "Auto Video Bot"
          git config user.email "bot@github.com"
          git add stories.json
          git commit -m "Marked story as done" || exit 0
          git push
